<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EnergyHub 管理后台</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="admin-topbar">
    <div class="brand">EnergyHub<span class="brand-sub">管理后台</span></div>
    <div class="status-pills" id="statusPills" title="每 30 秒自动刷新">
      <span class="pill pill-muted">状态加载中…</span>
    </div>
  </header>

  <div class="layout">
    <nav class="side-nav" aria-label="后台导航">
      <a href="#/sources" data-view="sources">信源管理</a>
      <a href="#/content" data-view="content">内容运营</a>
      <a href="#/config" data-view="config">配置</a>
      <a href="#/analytics" data-view="analytics">流量</a>
      <a href="#/publish" data-view="publish">发布</a>
    </nav>

    <main class="view-area" id="viewArea">
      <div class="loading-state">加载中…</div>
    </main>
  </div>

  <div class="toast-wrap" id="toastWrap"></div>
  <div class="modal-root" id="modalRoot"></div>

  <script src="app.js"></script>
</body>
</html>
