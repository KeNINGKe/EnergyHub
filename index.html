<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EnergyHub · 能源 / 储能 / AIDC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Anta:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=18">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <h1>EnergyHub</h1>
      <p class="subtitle">电力 · 储能 · AIDC 信息聚合</p>
    </div>
  </header>

  <nav class="view-tabs" aria-label="视图切换">
    <button class="view-tab active" data-tab="featured">精选</button>
    <button class="view-tab" data-tab="all">全部动态</button>
    <button class="view-tab" data-tab="sources">信息源</button>
  </nav>

  <main class="container">
    <section id="featured" class="tab-panel active" aria-labelledby="tab-featured">
      <div class="feed-header">
        <h2>精选</h2>
        <p id="featuredMeta"></p>
      </div>
      <div class="hot-card" id="hotListBlock" hidden>
        <div class="hot-card-head">
          <span class="hot-card-title">今日热点</span>
          <span class="hot-card-meta">储能 · AIDC 优先 · 北美最优先</span>
        </div>
        <ol class="hot-card-list" id="hotList"></ol>
      </div>
      <div class="timeline" id="featuredTimeline">
        <div class="loading-state">加载中…</div>
      </div>
      <div class="featured-view-all" id="featuredViewAll"></div>
    </section>

    <section id="all" class="tab-panel" aria-labelledby="tab-all">
      <div class="feed-header">
        <h2>全部动态</h2>
        <p id="allMeta"></p>
      </div>
      <div class="timeline" id="allTimeline">
        <div class="loading-state">加载中…</div>
      </div>
    </section>

    <section id="sources" class="tab-panel" aria-labelledby="tab-sources">
      <div class="browse-layout">
        <aside class="category-sidebar">
          <div id="categoryList">
            <div class="loading-state">加载中…</div>
          </div>
        </aside>
        <div class="sources-stage" id="sourcesArea">
          <div class="loading-state">加载中…</div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <span id="updatedAt">-</span>
    <span class="footer-credit">@Jereh-Power</span>
  </footer>

  <script src="assets/app.js?v=14"></script>
</body>
</html>
