name: Fetch RSS Feeds

on:
  schedule:
    # 北京时间每天 04:37 = UTC 20:37（前一天）。故意避开整点：GitHub 免费
    # runner 在整点/高峰时段拥堵严重，09-28 的 UTC 21:00 定时 run 直接被
    # 丢弃导致当日日报未发。构建完成后仍会睡到北京 08:00 准点推送。
    # 2026-09-29 起每天只构建一次（原中午 11:43 的第二次已去掉）：内容更新
    # 频率对读者无感，却省一半 Jev API 调用/翻译配额/Actions 时长。
    - cron: '37 20 * * *'
  workflow_dispatch:
    inputs:
      force_push:
        description: '跳过推送防重闸门强制推送（测试/补发用）'
        type: boolean
        default: false

# AI 回执状态（.state/ai）经 artifact 跨运行恢复（阶段 C-02）。并发 run
# （迟到定时/守卫补发/手动）若同时写回执分片会交叉覆盖——串行排队不取消：
# 后到的 run 排队执行，用最新 artifact 恢复，不丢任何一次的写入。
concurrency:
  group: fetch-feeds
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify code and existing data
        # 测试偶发 flaky（node:test 子进程 V8 序列化崩溃，见 2026-10-16 排障）不应
        # 阻断每天准点推送——推送是 best-effort，守卫另有兜底；真实数据问题由
        # validate-data / 构建失败日志暴露。continue-on-error 只对测试崩溃容错。
        continue-on-error: true
        run: npm run verify

      # AI 回执缓存/用量账本恢复（阶段 C-02）：上一次 run 上传的 ai-state
      # artifact 下载回 .state——同输入的调用命中缓存不再付费重调；2026-10-22
      # 起范围扩到 .state/shadow（影子评分/影子观察报告，阶段 C-01/D 跨运行积累）。
      # artifact 不存在（首次运行/已过期）按无缓存冷启动，不报错。
      - name: Restore AI receipts state
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ai-state
          path: .state

      - name: Build V2 daily feed
        run: npm run build:v2
        env:
          # MyMemory 翻译配额邮箱（提升到 50000 字符/天）。在仓库
          # Settings → Secrets → Actions 配置 MYMEMORY_EMAIL；未配置时
          # 退回匿名 5000 字符/天，批量新标题可能漏翻。
          MYMEMORY_EMAIL: ${{ secrets.MYMEMORY_EMAIL }}
          # Jev 复审（TypeSafe AI 决策模型，直连 api.typesafe.ai）。2026-10-22 起
          # CI 设 JEV_REVIEW=off 显式关闭捞回/仲裁/语义合并：直连 key 09-30 已失效、
          # 内部 LiteLLM 备胎 runner 不可达（内网域名），三件套实际已停 3 周——
          # 本次只上 AIHOT 影子+观察（它们直读备胎网关，不受此开关影响），
          # jev 复活待 0.75 阈值按 glm 校准后单独上线。
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          JEV_REVIEW: 'off'
          # 备胎网关（OpenAI 兼容）现指 OpenRouter（公开可达；内部 litellm.jereh.cn
          # 仅公司网络可解析，runner 连不上）。影子评分（C-01）与结构化观察（D）
          # 直读该网关；模型 z-ai/glm-5.3-flash 与影子夹具录制同源。
          JEV_FALLBACK_BASE_URL: ${{ secrets.JEV_FALLBACK_BASE_URL }}
          JEV_FALLBACK_API_KEY: ${{ secrets.JEV_FALLBACK_API_KEY }}
          JEV_FALLBACK_MODEL: z-ai/glm-5.3-flash
          # 阶段 C-02：AI 回执层（缓存/额度守卫）构建标识与预算。buildId 用
          # run_id 归一；预算默认值见 lib/ai-receipts.mjs，未配 vars 时留空走默认。
          AI_BUILD_ID: gh-run-${{ github.run_id }}
          AI_BUDGET_CALLS_PER_BUILD: ${{ vars.AI_BUDGET_CALLS_PER_BUILD }}
          AI_BUDGET_CALLS_24H: ${{ vars.AI_BUDGET_CALLS_24H }}
          AI_BUDGET_TOKENS_24H: ${{ vars.AI_BUDGET_TOKENS_24H }}
          AI_BUDGET_COST_24H: ${{ vars.AI_BUDGET_COST_24H }}
          # 原始输入快照（阶段 A 基线积累）：把管线真实输入（翻译+种子注入后）
          # gzip 进 samples/raw/<date>/，为未来基线保存 V2 时代日期。线上构建
          # 从不持久化原始输入，不快照则事后无法补齐。滚动清理见 prune 步骤。
          RAW_SNAPSHOT_DIR: samples/raw

      - name: Prune raw snapshots
        # 保留 30 天滚动清理（单日 gzip 后约 60~120KB）；先清理再 add。
        run: node scripts/prune-raw-snapshots.mjs --keep=30

      # AI 回执状态上传（阶段 C-02）：always() 保证构建失败也尽力保住已发生的
      # 调用回执与账本（进程被强杀前的最后一次响应不保证落地——方案 §6 已声明
      # 不承诺严格只计费一次）。artifact 只保留 30 天 bounding storage。
      # 并发组保证同一时刻只有一个 run 写此 artifact，无交叉覆盖。
      - name: Upload AI receipts state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-state
          path: .state
          retention-days: 30
          if-no-files-found: ignore

      - name: Commit and push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feeds/ samples/raw/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "committed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore: update daily feed"
            # 并发 run（迟到定时/手动补发/用户直推）会让 fast-forward push 被拒，
            # 整个 job 死在这里、钉钉推送永远走不到。push 被拒时 rebase 后重试。
            pushed=false
            for i in 1 2 3; do
              if git push; then pushed=true; break; fi
              git pull --rebase --autostash || true
            done
            $pushed
            echo "committed=true" >> $GITHUB_OUTPUT
          fi

      - name: Trigger deploy
        if: steps.commit.outputs.committed == 'true'
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches" \
            -d '{"ref":"main"}' -w "deploy trigger: %{http_code}\n"

      - name: Trigger GitHub Pages
        if: steps.commit.outputs.committed == 'true'
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches" \
            -d '{"ref":"main"}' -w "pages trigger: %{http_code}\n"

      - name: Wait until 08:00 Beijing time
        # 早晨构建受 GitHub 免费 runner 排队影响，实际在北京 06:00~08:00 之间
        # 完成。推送定在 08:00 整：构建早于 08:00 完成就在此睡到准点，晚于
        # 08:00 完成则脚本直接放行。仅早晨窗口等待；手动 dispatch 不等待，
        # 便于随时测试。等待失败也放行（后面照常推送）。
        if: github.event.schedule == '37 20 * * *'
        continue-on-error: true
        run: node scripts/lib/wait-until.mjs 08:00

      - name: Push daily hot list to DingTalk
        # 每天只推一次：早晨构建窗口（UTC 20:37）之后、北京时间 08:00 准点
        # 推送当天最新数据；手动 workflow_dispatch 也推送（不等待），便于测试。
        # 2026-10-10 双推事故（守卫补发 08:10 推过、迟到主调度 08:18 又推）后
        # 加防重闸门：推送前查早晨窗口内是否已有其他 run 推送成功，有则跳过。
        # 闸门查询失败按可推送处理（宁可重复，不可缺报）；dispatch 传
        # force_push=true 可跳过闸门（测试/人工补发用）。
        # 推送是 best-effort：失败不阻塞抓取/部署（见 continue-on-error）。
        if: |
          github.event_name == 'workflow_dispatch' ||
          github.event.schedule == '37 20 * * *'
        continue-on-error: true
        run: |
          rc=0
          node scripts/gate-dingtalk-push.mjs || rc=$?
          if [ "$rc" -eq 3 ]; then
            echo "今日已推送，跳过重复推送。"
          else
            if [ "$rc" -eq 1 ]; then
              echo "防重闸门查询失败，按可推送处理（宁可重复，不可缺报）。"
            fi
            node scripts/notify-dingtalk.mjs
          fi
        env:
          # 在仓库 Settings → Secrets and variables → Actions 配置：
          # DINGTALK_WEBHOOK（完整 webhook URL）、DINGTALK_WEBHOOK_SECRET（加签 secret，
          # 关键词/白名单模式可留空）。
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_WEBHOOK_SECRET: ${{ secrets.DINGTALK_WEBHOOK_SECRET }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          PUSH_GATE_BYPASS: ${{ github.event_name == 'workflow_dispatch' && inputs.force_push == true }}
