name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Prepare dist
        run: |
          mkdir -p dist
          cp index.html dist/
          cp -r assets dist/
          cp -r data dist/
          cp -r feeds dist/
      - name: Deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      # 腾讯云 CloudBase 静态托管（大陆免备案直连）。配置 TCB_ENV_ID 等三个 secrets 后自动生效；
      # 未配置时本步骤跳过，不影响 Cloudflare 部署。
      - name: Deploy to CloudBase (腾讯云静态托管)
        if: env.TCB_ENV_ID != ''
        env:
          CI: 'true'
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
        run: |
          npm install -g @cloudbase/cli
          tcb login --apiKeyId "${{ secrets.TCB_SECRET_ID }}" --apiKey "${{ secrets.TCB_SECRET_KEY }}"
          tcb hosting deploy ./dist --envId "$TCB_ENV_ID" --concurrency 10